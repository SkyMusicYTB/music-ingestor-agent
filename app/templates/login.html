{% extends "base.html" %}
{% block title %}Sign in · Music Agent{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Private music service</p>
  <h1>Sign in</h1>
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <form action="/login" method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" autocomplete="username" maxlength="80" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" maxlength="1024" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
