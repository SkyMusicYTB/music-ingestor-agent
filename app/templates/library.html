{% extends "base.html" %}
{% block title %}Library · Music Agent{% endblock %}
{% block live_page %}library{% endblock %}
{% block content %}
<section>
  <div class="section-heading"><h1>Library</h1>{% if user.role == 'admin' %}<button id="rescan-button" class="secondary small">Full rescan</button>{% endif %}</div>
  <p id="library-status" role="status" aria-live="polite" tabindex="-1"></p>
  <form method="get" action="/library" class="inline-form">
    <label>Search<input type="search" name="q" value="{{ query }}" maxlength="300" placeholder="Artist, title or album"></label>
    <label>Format<select name="format"><option value="">All formats</option>{% for name, count in result.format_counts|dictsort %}<option value="{{ name }}" {% if format_filter == name %}selected{% endif %}>{{ name|replace('.', '')|upper }} ({{ count }})</option>{% endfor %}</select></label>
    <label>Codec<select name="codec"><option value="">All codecs</option>{% for name, count in result.codec_counts|dictsort %}<option value="{{ name }}" {% if codec_filter == name %}selected{% endif %}>{{ name|upper }} ({{ count }})</option>{% endfor %}</select></label>
    <label>Show<select name="presence">{% for value, label in [('present', 'Present files'), ('missing', 'Missing history'), ('all', 'All records')] %}<option value="{{ value }}" {% if presence_filter == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label>Per page<select name="page_size">{% for size in [25, 50, 100] %}<option value="{{ size }}" {% if result.page_size == size %}selected{% endif %}>{{ size }}</option>{% endfor %}</select></label>
    <button type="submit">Apply</button>
  </form>
  {% include 'library_content.html' %}
</section>
{% endblock %}
