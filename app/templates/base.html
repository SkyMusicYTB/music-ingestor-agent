<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Music Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
  <script type="module" src="{{ asset_url('app.js') }}"></script>
</head>
<body data-live-page="{% block live_page %}general{% endblock %}" data-event-cursor="{{ event_cursor if event_cursor is defined else '' }}">
  <header class="site-header">
    <a class="brand" href="/">Music Agent</a>
    {% if user %}
    <nav aria-label="Main navigation">
      <a href="/">Discover</a>
      <a href="/downloads">Downloads</a>
      <a href="/library">Library</a>
      <a href="/usage">Usage</a>
      <a href="/settings">Settings</a>
    </nav>
    <form action="/logout" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="text-button">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    <div id="live-status" class="live-status" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
  <footer>Music Agent {{ app_version or '' }} · You are responsible for acquiring only media you may lawfully download.</footer>
</body>
</html>
