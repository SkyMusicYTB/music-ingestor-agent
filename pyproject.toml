[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "music-agent"
version = "0.1.0"
description = "Self-hosted intelligent music discovery and acquisition agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Private use"}
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "mutagen==1.47.0",
  "openai==1.109.1",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "rapidfuzz==3.14.1",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.13.0",
  "types-Pillow==10.2.0.20240822",
]

[project.scripts]
music-agent = "app.cli:main"
music-agent-worker = "app.workers.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "migrations"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
